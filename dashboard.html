<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntrusionGuard Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* CSS Styling to match the 'FrostGuard' look */
        :root {
            --bg-color: #eef2f9;
            --card-bg: #ffffff;
            --primary-purple: #4e38d6;
            --accent-green: #2ecc71;
            --accent-red: #e74c3c;
            --text-dark: #2c3e50;
            --text-light: #7f8c8d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: var(--text-dark);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header h1 {
            color: var(--primary-purple);
            margin: 0;
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--text-light);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 5px var(--accent-green);
        }

        /* Grid Layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 350px 1fr;
            /* Sidebar is 350px, Graph takes rest */
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        /* Readings Panel (Left Side) */
        .readings-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .device-selector {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #ddd;
            width: 100%;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .sensor-card {
            border-radius: 10px;
            padding: 15px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sensor-card.purple {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
        }

        .sensor-card.green {
            background: linear-gradient(135deg, #43cea2 0%, #185a9d 100%);
        }

        .sensor-card.orange {
            background: linear-gradient(135deg, #ff9966 0%, #ff5e62 100%);
        }

        .sensor-value {
            font-size: 32px;
            font-weight: bold;
        }

        .sensor-label {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 4px;
        }

        .system-status {
            margin-top: 10px;
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            width: fit-content;
        }

        .status-normal {
            background-color: #d4edda;
            color: #155724;
        }

        .status-alarm {
            background-color: #f8d7da;
            color: #721c24;
        }

        /* Chart Section */
        .chart-container {
            height: 300px;
            width: 100%;
        }

        .chart-title {
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 18px;
        }

        /* Bottom Row */
        .bottom-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .stats-box {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .stats-value {
            font-size: 24px;
            font-weight: bold;
            color: var(--text-dark);
        }

        .stats-label {
            font-size: 12px;
            color: var(--text-light);
        }

        /* Footer */
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: var(--text-light);
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
            IntrusionGuard
        </h1>
        <div class="status-badge">
            <div class="status-dot"></div>
            Connected
        </div>
    </div>

    <div class="dashboard-grid">

        <div class="card readings-panel">
            <h3>Current Readings</h3>

            <label style="font-size: 12px; color: #666;">Device:</label>
            <select class="device-selector">
                <option>M5Stack_Intruder_01</option>
            </select>

            <div class="sensor-card purple">
                <div>
                    <div class="sensor-label">Distance (Ultrasonic)</div>
                    <div class="sensor-value" id="dist-val">150</div>
                    <div style="font-size: 12px;">cm</div>
                </div>
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                    <path d="M2 12h20M2 12l4-4m-4 4l4 4" />
                </svg>
            </div>

            <div class="sensor-card green">
                <div>
                    <div class="sensor-label">Light Level</div>
                    <div class="sensor-value" id="light-val">450</div>
                    <div style="font-size: 12px;">lux</div>
                </div>
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                    <circle cx="12" cy="12" r="5" />
                    <path
                        d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
                </svg>
            </div>

            <div class="sensor-card orange">
                <div>
                    <div class="sensor-label">Motion (PIR)</div>
                    <div class="sensor-value" id="motion-val">None</div>
                    <div style="font-size: 12px;">Status</div>
                </div>
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                    <path d="M23 7l-7 5 7 5V7z" />
                    <rect x="1" y="5" width="15" height="14" rx="2" ry="2" />
                </svg>
            </div>

            <div>
                <span class="system-status status-normal" id="sys-status">System Normal</span>
            </div>

            <div class="footer">Last updated: <span id="last-updated">Just now</span></div>
        </div>

        <div class="card">
            <div class="chart-title">Ultrasonic Distance History (Live)</div>
            <div class="chart-container">
                <canvas id="distanceChart"></canvas>
            </div>
        </div>
    </div>

    <div class="bottom-row">
        <div class="card">
            <div class="chart-title">Light Sensor History (Live)</div>
            <div class="chart-container">
                <canvas id="lightChart"></canvas>
            </div>
        </div>

        <div class="card" style="display: flex; flex-direction: column; justify-content: center; gap: 20px;">
            <div class="chart-title" style="text-align: center;">Session Stats</div>

            <div class="stats-box">
                <div class="stats-label">Avg Distance</div>
                <div class="stats-value">145 cm</div>
            </div>

            <div class="stats-box">
                <div class="stats-label">Min Light Level</div>
                <div class="stats-value">320 lux</div>
            </div>

            <div class="stats-box">
                <div class="stats-label">Intrusions Detected</div>
                <div class="stats-value" style="color: var(--accent-red);">0</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // --- 1. CONFIGURATION ---
        const WS_URL = "ws://localhost:3000"; // WebSocket connection to server
        let ws = null;

        // --- 2. SETUP THE CHARTS ---
        const ctxDist = document.getElementById('distanceChart').getContext('2d');
        const ctxLight = document.getElementById('lightChart').getContext('2d');

        let distData = [];
        let lightData = [];
        let labels = [];

        const distanceChart = new Chart(ctxDist, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Distance (cm)',
                    data: distData,
                    borderColor: '#4e38d6',
                    backgroundColor: 'rgba(78, 56, 214, 0.1)',
                    borderWidth: 2,
                    tension: 0.4,
                    fill: true
                }]
            },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true }, x: { display: false } } }
        });

        const lightChart = new Chart(ctxLight, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Light Level (lux)',
                    data: lightData,
                    borderColor: '#2ecc71',
                    backgroundColor: 'rgba(46, 204, 113, 0.1)',
                    borderWidth: 2,
                    tension: 0.4,
                    fill: true
                }]
            },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true }, x: { display: false } } }
        });

        // --- 3. CONNECT TO WEBSOCKET ---
        function connectWebSocket() {
            try {
                ws = new WebSocket(WS_URL);

                ws.onopen = function () {
                    console.log('✅ Connected to dashboard server');
                    document.querySelector('.status-dot').style.boxShadow = '0 0 5px var(--accent-green)';
                };

                ws.onmessage = function (event) {
                    try {
                        const payload = JSON.parse(event.data);
                        console.log('📨 MQTT data received:', payload);
                        updateDashboard(payload);
                    } catch (e) {
                        console.error('Parse error:', e);
                    }
                };

                ws.onerror = function (err) {
                    console.warn('⚠️ WebSocket error');
                };

                ws.onclose = function () {
                    console.log('❌ Connection closed. Reconnecting in 3s...');
                    document.querySelector('.status-dot').style.boxShadow = '0 0 5px red';
                    setTimeout(connectWebSocket, 3000);
                };

            } catch (err) {
                console.error('Connection error:', err);
                setTimeout(connectWebSocket, 3000);
            }
        }

        // Update dashboard from MQTT message
        function updateDashboard(payload) {
            const distance = Number(payload.distance || 0);
            const light_level = Number(payload.light_level || 0);
            const motion_detected = payload.motion_detected === true || payload.motion_detected === 'true';

            // Update sidebar values
            document.getElementById('dist-val').innerText = distance;
            document.getElementById('light-val').innerText = light_level;
            document.getElementById('motion-val').innerText = motion_detected ? 'DETECTED' : 'None';

            // Update status
            const statusEl = document.getElementById('sys-status');
            if (motion_detected) {
                statusEl.innerText = 'INTRUSION ALERT';
                statusEl.className = 'system-status status-alarm';
            } else {
                statusEl.innerText = 'System Normal';
                statusEl.className = 'system-status status-normal';
            }

            document.getElementById('last-updated').innerText = new Date().toLocaleTimeString();

            // Add to chart (keep rolling 20 points)
            labels.push(new Date().toLocaleTimeString('en-US', { hour12: false }));
            distData.push(distance);
            lightData.push(light_level);

            if (labels.length > 20) {
                labels.shift();
                distData.shift();
                lightData.shift();
            }

            distanceChart.update();
            lightChart.update();
            
            console.log('✅ Dashboard updated - Distance:', distance, 'Light:', light_level, 'Motion:', motion_detected);
        }

        // Start WebSocket connection on page load
        connectWebSocket();
    </script>
</body>

</html>

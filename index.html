<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntrusionGuard Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Amplify Auth (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@aws-amplify/core@5.x.x/dist/aws-amplify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@aws-amplify/auth@5.x.x/dist/aws-amplify-auth.min.js"></script>
    <style>
        /* CSS Styling to match the 'FrostGuard' look */
        :root {
            --bg-color: #eef2f9;
            --card-bg: #ffffff;
            --primary-purple: #4e38d6;
            --accent-green: #2ecc71;
            --accent-red: #e74c3c;
            --text-dark: #2c3e50;
            --text-light: #7f8c8d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: var(--text-dark);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header h1 {
            color: var(--primary-purple);
            margin: 0;
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* START OF NEW BUTTON STYLES */
        .power-btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; margin-left: 20px; transition: background 0.3s; } /* the on/off button strat: styling for button layout */
        .power-btn.on { background-color: #e74c3c; color: white; } /* the on/off button strat: red style when system is running */
        .power-btn.off { background-color: #2ecc71; color: white; } /* the on/off button strat: green style when system is paused */
        .power-btn:disabled { opacity: 0.7; cursor: not-allowed; } /* the on/off button strat: dim button while loading */

        /* --- ADDED FOR S3 DOWNLOAD FEATURE --- */
        .download-btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; margin-left: 10px; transition: background 0.3s; background-color: #3498db; color: white; }
        .download-btn:hover { background-color: #2980b9; }
        .download-btn:disabled { opacity: 0.7; cursor: not-allowed; }
        /* ------------------------------------- */

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--text-light);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 5px var(--accent-green);
        }

        /* Grid Layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 350px 1fr;
            /* Sidebar is 350px, Graph takes rest */
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        /* Readings Panel (Left Side) */
        .readings-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .device-selector {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #ddd;
            width: 100%;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .sensor-card {
            border-radius: 10px;
            padding: 15px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sensor-card.purple {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
        }

        .sensor-card.green {
            background: linear-gradient(135deg, #43cea2 0%, #185a9d 100%);
        }

        .sensor-card.orange {
            background: linear-gradient(135deg, #ff9966 0%, #ff5e62 100%);
        }

        .sensor-value {
            font-size: 32px;
            font-weight: bold;
        }

        .sensor-label {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 4px;
        }

        .system-status {
            margin-top: 10px;
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            width: fit-content;
        }

        .status-normal {
            background-color: #d4edda;
            color: #155724;
        }

        .status-alarm {
            background-color: #f8d7da;
            color: #721c24;
        }

        /* Chart Section */
        .chart-container {
            height: 300px;
            width: 100%;
        }

        .chart-title {
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 18px;
        }

        /* Bottom Row */
        .bottom-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .stats-box {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .stats-value {
            font-size: 24px;
            font-weight: bold;
            color: var(--text-dark);
        }

        .stats-label {
            font-size: 12px;
            color: var(--text-light);
        }

        /* Footer */
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: var(--text-light);
        }
    </style>
</head>

<body>

    <div id="cognito-login" style="display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap;">
        <input type="text" id="cognito-username" placeholder="Username" style="padding:6px 10px; border:1px solid #ddd; border-radius:6px;">
        <input type="password" id="cognito-password" placeholder="Password" style="padding:6px 10px; border:1px solid #ddd; border-radius:6px;">
        <button id="cognito-login-btn" class="download-btn" style="background-color:#1abc9c">Login</button>
        <div id="cognito-status" style="font-size:12px; color:#7f8c8d;"></div>
    </div>

    <div class="header">
        <h1>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
            IntrusionGuard
            <div>
                <button id="downloadBtn" class="download-btn" onclick="downloadReport()">📥 Download Report</button>
                <button id="testPostBtn" class="download-btn" style="background-color:#8e44ad" onclick="postTestReading()">🚀 Send Test Reading</button>
                <button id="powerBtn" class="power-btn on" onclick="togglePower()">STOP SYSTEM</button> 
            </div>
        </h1>
        <div class="status-badge">
            <div class="status-dot"></div>
            Connected
        </div>
    </div>

    <div class="dashboard-grid">

        <div class="card readings-panel">
            <h3>Current Readings</h3>

            <label style="font-size: 12px; color: #666;">Device:</label>
            <select class="device-selector">
                <option>M5Stack_Intruder_01</option>
            </select>

            <div class="sensor-card purple">
                <div>
                    <div class="sensor-label">Distance (Ultrasonic)</div>
                    <div class="sensor-value" id="dist-val">--</div>
                    <div style="font-size: 12px;">cm</div>
                </div>
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                    <path d="M2 12h20M2 12l4-4m-4 4l4 4" />
                </svg>
            </div>

            <div class="sensor-card green">
                <div>
                    <div class="sensor-label">Light Level</div>
                    <div class="sensor-value" id="light-val">--</div>
                    <div style="font-size: 12px;">lux</div>
                </div>
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                    <circle cx="12" cy="12" r="5" />
                    <path
                        d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
                </svg>
            </div>

            <div class="sensor-card orange">
                <div>
                    <div class="sensor-label">Motion (PIR)</div>
                    <div class="sensor-value" id="motion-val">None</div>
                    <div style="font-size: 12px;">Status</div>
                </div>
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                    <path d="M23 7l-7 5 7 5V7z" />
                    <rect x="1" y="5" width="15" height="14" rx="2" ry="2" />
                </svg>
            </div>

            <div>
                <span class="system-status status-normal" id="sys-status">System Normal</span>
            </div>

            <div class="footer">Last updated: <span id="last-updated">Just now</span></div>
        </div>

        <div class="card">
            <div class="chart-title">Ultrasonic Distance History (Live)</div>
            <div class="chart-container">
                <canvas id="distanceChart"></canvas>
            </div>
        </div>
    </div>

    <div class="bottom-row">
        <div class="card">
            <div class="chart-title">Light Sensor History (Live)</div>
            <div class="chart-container">
                <canvas id="lightChart"></canvas>
            </div>
        </div>

        <div class="card" style="display: flex; flex-direction: column; justify-content: center; gap: 20px;">
            <div class="chart-title" style="text-align: center;">Session Stats</div>

            <div class="stats-box">
                <div class="stats-label">Avg Distance</div>
                <div class="stats-value">145 cm</div>
            </div>

            <div class="stats-box">
                <div class="stats-label">Min Light Level</div>
                <div class="stats-value">320 lux</div>
            </div>

            <div class="stats-box">
                <div class="stats-label">Intrusions Detected</div>
                <div class="stats-value" style="color: var(--accent-red);">0</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // --- COGNITO CONFIG ---
        Amplify.configure({
            Auth: {
                region: 'ap-southeast-1',
                userPoolId: 'ap-southeast-1_DJAO7DTJZ',
                userPoolWebClientId: '2rqv045jo7k6enjsh6ianjvgds'
            }
        });

        async function checkUser() {
            try {
                const user = await Amplify.Auth.currentAuthenticatedUser();
                document.getElementById('cognito-status').innerText = `Logged in as ${user.username}`;
                console.log('User logged in:', user.username);
            } catch (err) {
                console.log('No user logged in');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkUser();
            const btn = document.getElementById('cognito-login-btn');
            btn.addEventListener('click', async () => {
                const username = document.getElementById('cognito-username').value;
                const password = document.getElementById('cognito-password').value;
                try {
                    const user = await Amplify.Auth.signIn(username, password);
                    document.getElementById('cognito-status').innerText = `Logged in as ${user.username}`;
                    console.log('Cognito user object:', user);
                } catch (err) {
                    document.getElementById('cognito-status').innerText = `Login failed: ${err.message}`;
                    console.error(err);
                }
            });
        });
    </script>
    <script>
        // --- 1. CONFIGURATION ---
        // Use API Gateway /readings endpoint directly (supports GET & POST)
        const API_READINGS = "https://yge6fdq3va.execute-api.ap-southeast-1.amazonaws.com/readings";
        const ENABLE_WS = new URLSearchParams(location.search).get('ws') === '1'; // opt-in only
        const wsHost = location.host && location.host.length > 0 ? location.host : 'localhost:4001';
        const WS_URL = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${wsHost}`; // Match current host/port or fallback
        let ws = null;

        // --- 2. SETUP THE CHARTS ---
        const ctxDist = document.getElementById('distanceChart').getContext('2d');
        const ctxLight = document.getElementById('lightChart').getContext('2d');

        let distData = [];
        let lightData = [];
        let labels = [];

        const distanceChart = new Chart(ctxDist, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Distance (cm)',
                    data: distData,
                    borderColor: '#4e38d6',
                    backgroundColor: 'rgba(78, 56, 214, 0.1)',
                    borderWidth: 2,
                    tension: 0.4,
                    fill: true
                }]
            },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true }, x: { display: false } } }
        });

        const lightChart = new Chart(ctxLight, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Light Level (lux)',
                    data: lightData,
                    borderColor: '#2ecc71',
                    backgroundColor: 'rgba(46, 204, 113, 0.1)',
                    borderWidth: 2,
                    tension: 0.4,
                    fill: true
                }]
            },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true }, x: { display: false } } }
        });

        // --- 3. ADDED: FETCH HISTORY (For Charts on Load) ---
        async function loadHistory() {
            try {
                // Ask API Gateway for last 20 records
                const res = await fetch(API_READINGS + "?limit=20");
                const data = await res.json();
                const history = data.reverse(); 

                history.forEach(item => {
                    const t = new Date(item.time).toLocaleTimeString('en-US', { hour12: false });
                    labels.push(t);
                    distData.push(item.distance);
                    lightData.push(item.light_level);
                });

                distanceChart.update();
                lightChart.update();
            } catch (err) {
                console.error("History fetch failed:", err);
            }
        }

        // --- 4. ADDED: DOWNLOAD REPORT FUNCTION (FILTERED FOR INTRUDERS) ---
        async function downloadReport() {
            const btn = document.getElementById('downloadBtn');
            btn.disabled = true;
            btn.innerText = "Generating...";

            try {
                // Fetch last 100 records
                const res = await fetch(API_READINGS + "?limit=100");
                const data = await res.json();
                
                if (!data || data.length === 0) {
                    alert("No data found.");
                    btn.disabled = false;
                    btn.innerText = "📥 Download Report";
                    return;
                }

                // Filter logic to only include actual "Intruder" events based on Lambda thresholds
                const intruderOnlyData = data.filter(row => {
                    let score = 0;
                    const distance = Number(row.distance || 0);
                    const light = Number(row.light_level || 0);
                    const motion = Number(row.motion_detected || 0);

                    // Logic matching your Lambda: Any single trigger scores 2 points
                    if (distance > 0 && distance < 200) score += 2;
                    if (motion === 1) score += 2;
                    if (light > 450) score += 2;
                    
                    return score >= 2; 
                });

                if (intruderOnlyData.length === 0) {
                    alert("No actual intrusions detected in the last 100 readings.");
                    btn.disabled = false;
                    btn.innerText = "📥 Download Report";
                    return;
                }

                // Convert filtered data to CSV
                let csv = "Time,Distance(cm),Light(lux),Motion\n";
                intruderOnlyData.forEach(row => {
                    csv += `${new Date(row.time).toLocaleString()},${row.distance},${row.light_level},${row.motion_detected}\n`;
                });

                // Trigger Download
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = "MaxGuard_Intruder_Report.csv";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            } catch (err) {
                console.error(err);
                alert("Download failed");
            }
            btn.disabled = false;
            btn.innerText = "📥 Download Report";
        }

        // --- POST a test reading to /readings (API Gateway) ---
        async function postTestReading() {
            const btn = document.getElementById('testPostBtn');
            btn.disabled = true;
            btn.innerText = "Sending...";
            try {
                const payload = {
                    device_id: 1,
                    time: new Date().toISOString(),
                    distance: 123,
                    light_level: 456,
                    motion_detected: true
                };
                const res = await fetch(API_READINGS, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) throw new Error(`POST failed: ${res.status}`);
                console.log('POSTed test reading', payload);
                alert('Test reading sent. Check DynamoDB/GET.');
            } catch (err) {
                console.error(err);
                alert('Failed to send test reading');
            }
            btn.disabled = false;
            btn.innerText = "🚀 Send Test Reading";
        }

        // --- 5. CONNECT TO WEBSOCKET ---
        async function pollLatest() {
            try {
                const res = await fetch(API_READINGS + "?limit=1");
                const data = await res.json();
                if (Array.isArray(data) && data.length > 0) {
                    updateDashboard(data[0]);
                }
            } catch (err) {
                console.warn('Polling failed', err);
            }
        }

        function startPolling() {
            pollLatest();
            setInterval(pollLatest, 5000);
        }

        function connectWebSocket() {
            if (!ENABLE_WS) {
                document.querySelector('.status-dot').style.boxShadow = '0 0 5px orange';
                console.log('WebSocket disabled; using API polling only');
                return;
            }
            try {
                ws = new WebSocket(WS_URL);

                ws.onopen = function () {
                    console.log('✅ Connected to dashboard server');
                    document.querySelector('.status-dot').style.boxShadow = '0 0 5px var(--accent-green)';
                };

                ws.onmessage = function (event) {
                    try {
                        const payload = JSON.parse(event.data);
                        console.log('📨 MQTT data received:', payload);
                        updateDashboard(payload);
                    } catch (e) {
                        console.error('Parse error:', e);
                    }
                };

                ws.onerror = function () {
                    console.warn('⚠️ WebSocket error');
                };

                ws.onclose = function () {
                    console.log('❌ Connection closed. Staying on API polling.');
                    document.querySelector('.status-dot').style.boxShadow = '0 0 5px orange';
                };

            } catch (err) {
                console.error('Connection error:', err);
                document.querySelector('.status-dot').style.boxShadow = '0 0 5px orange';
            }
        }

        // Update dashboard from MQTT message
        function updateDashboard(payload) {
            const distance = Number(payload.distance || 0);
            const light_level = Number(payload.light_level || 0);
            const motion_detected =
                payload.motion_detected === true ||
                payload.motion_detected === 'true' ||
                payload.motion_detected === 1 ||
                payload.motion_detected === '1';

            // Update sidebar values
            document.getElementById('dist-val').innerText = distance;
            document.getElementById('light-val').innerText = light_level;
            document.getElementById('motion-val').innerText = motion_detected ? 'DETECTED' : 'None';

            // --- CHECK INTRUDER STATUS (STRICT LOGIC: >= 2 Points = Alert) ---
            let score = 0;
            if (distance > 0 && distance < 200) score += 2; // Close Proximity (Danger)
            if (motion_detected) score += 2;                // Motion (Strict: 2 points)
            if (light_level > 450) score += 2;              // Bright Light (Strict: 2 points)

            // Alert if Score >= 2 (Matches Email Logic)
            const statusEl = document.getElementById('sys-status');
            if (score >= 2) {
                statusEl.innerText = 'INTRUSION ALERT';
                statusEl.className = 'system-status status-alarm';
            } else {
                statusEl.innerText = 'System Normal';
                statusEl.className = 'system-status status-normal';
            }
            // -----------------------------------------------------

            document.getElementById('last-updated').innerText = new Date().toLocaleTimeString();

            // Add to chart (keep rolling 20 points)
            labels.push(new Date().toLocaleTimeString('en-US', { hour12: false }));
            distData.push(distance);
            lightData.push(light_level);

            if (labels.length > 20) {
                labels.shift();
                distData.shift();
                lightData.shift();
            }

            distanceChart.update();
            lightChart.update();
            
            console.log('✅ Dashboard updated - Score:', score);
        }

        // Start WebSocket connection on page load (AND Load History)
        window.onload = function() {
            loadHistory();
            startPolling();
            connectWebSocket();
        };

        // --- NEW BUTTON LOGIC ---
        let isSystemOn = true; // the on/off button strat: variable to track if system is running
        async function togglePower() { // the on/off button strat: main function called by button click
            const btn = document.getElementById('powerBtn'); // the on/off button strat: grab button element
            const action = isSystemOn ? "OFF" : "ON"; // the on/off button strat: decide whether to kill or start
            
            btn.disabled = true; // the on/off button strat: prevent double clicking
            btn.innerText = "Processing..."; // the on/off button strat: visual feedback for user
            
            try { // the on/off button strat: safe network call wrapper
                // Keeps your original URL (f5pvdids5i) for the toggle
                const res = await fetch("https://f5pvdids5i.execute-api.ap-southeast-1.amazonaws.com/default/M5Toggle", { // the on/off button strat: hit your specific API gateway
                    method: "POST", // the on/off button strat: standard post request
                    headers: {"Content-Type": "application/json"}, // the on/off button strat: header config
                    body: JSON.stringify({action: action}) // the on/off button strat: send the command payload
                }); // the on/off button strat: end of fetch call
                
                if (res.ok) { // the on/off button strat: if server said 200 OKs
                    isSystemOn = !isSystemOn; // the on/off button strat: flip the logic switch
                    btn.className = isSystemOn ? "power-btn on" : "power-btn off"; // the on/off button strat: change css class (red/green)
                    btn.innerText = isSystemOn ? "STOP SYSTEM" : "START SYSTEM"; // the on/off button strat: update button label
                } else { // the on/off button strat: if server error
                    alert("Failed to toggle power."); // the on/off button strat: alert user
                } // the on/off button strat: end if/else
            } catch(e) { // the on/off button strat: catch network errors
                console.error(e); // the on/off button strat: log error
                alert("Network Error - Check Console"); // the on/off button strat: alert user
            } // the on/off button strat: end catch
            
            btn.disabled = false; // the on/off button strat: re-enable button
            // If failed, revert text logic is handled by not updating 'isSystemOn' above
            if (!btn.disabled && isSystemOn) btn.innerText = "STOP SYSTEM"; // the on/off button strat: safety text reset
            if (!btn.disabled && !isSystemOn) btn.innerText = "START SYSTEM"; // the on/off button strat: safety text reset
        } // the on/off button strat: end function
    </script>
</body>

</html>

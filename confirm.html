<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Email - MaxGuard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
            font-size: 28px;
        }

        .info-text {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .email-display {
            background-color: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
            color: #2ecc71;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e1e1;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
            text-align: center;
            letter-spacing: 5px;
            font-size: 18px;
        }

        input:focus {
            outline: none;
            border-color: #2ecc71;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-bottom: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: white;
            color: #2ecc71;
            border: 2px solid #2ecc71;
        }

        .message {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .message.error {
            background-color: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .message.success {
            background-color: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            color: #2ecc71;
            text-decoration: none;
            font-weight: 500;
        }

        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Verify Your Email</h1>
        
        <div class="info-text">
            We've sent a verification code to:
        </div>
        
        <div class="email-display" id="emailDisplay">email@example.com</div>

        <div id="message" class="message"></div>

        <form id="confirmForm">
            <div class="form-group">
                <label for="code">Verification Code</label>
                <input type="text" id="code" name="code" required maxlength="6" placeholder="000000">
            </div>

            <button type="submit" class="btn" id="confirmBtn">Verify Email</button>
            <button type="button" class="btn btn-secondary" id="resendBtn">Resend Code</button>
        </form>

        <div class="links">
            <a href="signin.html">Back to Sign In</a>
        </div>
    </div>

    <!-- Amazon Cognito Identity SDK -->
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.6/dist/amazon-cognito-identity.min.js"></script>
    <script src="cognito-config.js"></script>
    <script>
        const poolData = {
            UserPoolId: cognitoConfig.userPoolId,
            ClientId: cognitoConfig.userPoolWebClientId
        };
        const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);

        const confirmForm = document.getElementById('confirmForm');
        const messageDiv = document.getElementById('message');
        const confirmBtn = document.getElementById('confirmBtn');
        const resendBtn = document.getElementById('resendBtn');
        const emailDisplay = document.getElementById('emailDisplay');

        // Get email from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');

        if (email) {
            emailDisplay.textContent = email;
        } else {
            showMessage('No email provided. Please sign up first.', 'error');
            setTimeout(() => {
                window.location.href = 'signup.html';
            }, 2000);
        }

        function showMessage(message, type) {
            messageDiv.textContent = message;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
        }

        function hideMessage() {
            messageDiv.style.display = 'none';
        }

        confirmForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessage();

            if (!email) {
                showMessage('No email provided', 'error');
                return;
            }

            const code = document.getElementById('code').value;

            if (code.length !== 6) {
                showMessage('Please enter a 6-digit verification code', 'error');
                return;
            }

            confirmBtn.disabled = true;
            confirmBtn.textContent = 'Verifying...';

            const userData = {
                Username: email,
                Pool: userPool
            };
            const cognitoUser = new AmazonCognitoIdentity.CognitoUser(userData);

            cognitoUser.confirmRegistration(code, true, (err, result) => {
                if (err) {
                    console.error('Confirmation error:', err);
                    
                    let errorMessage = 'An error occurred during verification';
                    
                    if (err.code === 'CodeMismatchException') {
                        errorMessage = 'Invalid verification code';
                    } else if (err.code === 'ExpiredCodeException') {
                        errorMessage = 'Verification code has expired. Please request a new one.';
                    } else if (err.code === 'NotAuthorizedException') {
                        errorMessage = 'User is already confirmed';
                        showMessage(errorMessage, 'error');
                        setTimeout(() => {
                            window.location.href = 'signin.html';
                        }, 2000);
                        return;
                    } else if (err.message) {
                        errorMessage = err.message;
                    }
                    
                    showMessage(errorMessage, 'error');
                    confirmBtn.disabled = false;
                    confirmBtn.textContent = 'Verify Email';
                    return;
                }

                console.log('Confirmation success:', result);
                showMessage('Email verified successfully! Redirecting to sign in...', 'success');
                
                setTimeout(() => {
                    window.location.href = 'signin.html';
                }, 2000);
            });
        });

        resendBtn.addEventListener('click', () => {
            hideMessage();

            if (!email) {
                showMessage('No email provided', 'error');
                return;
            }

            resendBtn.disabled = true;
            resendBtn.textContent = 'Sending...';

            const userData = {
                Username: email,
                Pool: userPool
            };
            const cognitoUser = new AmazonCognitoIdentity.CognitoUser(userData);

            cognitoUser.resendConfirmationCode((err, result) => {
                if (err) {
                    console.error('Resend error:', err);
                    
                    let errorMessage = 'Error resending code';
                    
                    if (err.code === 'LimitExceededException') {
                        errorMessage = 'Too many requests. Please wait before trying again.';
                    } else if (err.code === 'InvalidParameterException') {
                        errorMessage = 'User is already confirmed';
                        showMessage(errorMessage, 'error');
                        setTimeout(() => {
                            window.location.href = 'signin.html';
                        }, 2000);
                        return;
                    } else if (err.message) {
                        errorMessage = err.message;
                    }
                    
                    showMessage(errorMessage, 'error');
                    resendBtn.disabled = false;
                    resendBtn.textContent = 'Resend Code';
                    return;
                }

                console.log('Resend success:', result);
                showMessage('Verification code sent! Please check your email.', 'success');
                
                resendBtn.disabled = false;
                resendBtn.textContent = 'Resend Code';
            });
        });

        // Auto-format code input (optional)
        document.getElementById('code').addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
        });
    </script>
</body>
</html>
